
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5A Müzik</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(ellipse at top, #501414, #101010 70%);
}

.player {
  width: 100%;
  max-width: 480px;
  padding: 28px;
  background: #181818;
  border: 1px solid #383838;
  border-radius: 24px;
  box-shadow: 0 20px 60px #0008;
}

.logo {
  width: 150px;
  height: 100px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  border-radius: 22px;
  background: #ff0000;
  font-size: 43px;
  font-weight: bold;
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 30px;
}

.song {
  padding: 18px;
  margin-top: 15px;
  background: #252525;
  border-radius: 16px;
}

.song h2 {
  margin: 0 0 12px;
  font-size: 19px;
}

.song p {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 15px;
}

audio {
  width: 100%;
}

.note {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<main class="player">

  <div class="logo">▶ 5A</div>

  <h1>5A Müzik</h1>
  <p class="subtitle">Sınıfımızın müzikleri 🎵</p>

  <div class="song">
    <h2>🎵 Darari</h2>
    <p>5A Müzik • Birinci şarkı</p>

    <audio class="music" controls preload="metadata">
      <source src="sarki.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="song">
    <h2>🌙 Ay'ın Evreleri</h2>
    <p>5A Müzik • İkinci şarkı</p>

    <audio class="music" controls preload="metadata">
      <source src="sarki1.mp3" type="audio/mpeg">
    </audio>
  </div>

  <p class="note">
    Kulaklığını tak ve müziğin keyfini çıkar!<br>
    5A • İyi dinlemeler
  </p>

</main>

<script>
const players = document.querySelectorAll(".music");

players.forEach(player => {
  player.addEventListener("play", () => {
    players.forEach(other => {
      if (other !== player) {
        other.pause();
      }
    });
  });
});
</script>

</body>
</html>
