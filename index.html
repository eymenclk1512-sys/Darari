
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5A Müzik</title>
  <meta name="theme-color" content="#101010">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(ellipse at top, #392020, #101010 65%);
    }

    .player {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #343434;
      border-radius: 24px;
      background: #181818;
      box-shadow: 0 20px 60px #0008;
      text-align: center;
    }

    .logo {
      width: 180px;
      height: 120px;
      margin: 10px auto 24px;
      display: grid;
      place-items: center;
      border-radius: 25px;
      background: #ff0000;
      font-size: 55px;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .logo span { font-size: 45px; margin-right: 8px; }

    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { color: #aaa; margin-bottom: 28px; }

    audio {
      width: 100%;
      margin: 12px 0;
    }

    .note {
      color: #888;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <main class="player">
    <div class="logo"><span>▶</span>5A</div>

    <h1>5A Müzik</h1>
    <p class="subtitle">Özel şarkımız 🎵</p>

    <audio controls preload="metadata">
      <source src="sarki.mp3" type="audio/mpeg">
      Tarayıcınız ses oynatmayı desteklemiyor.
    </audio>

    <p class="note">
      Kulaklığını tak ve müziğin keyfini çıkar!<br>
      5A • İyi dinlemeler
    </p>
  </main>
</body>
</html>
